# NOTE: 依存は Pipfile で管理しています。ここはツールの設定だけです。

[tool.ruff]
target-version = "py314"
# NOTE: 日本語のコメントは幅 2 で数えられるので、少し長めにしています。
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# NOTE: テストではダミーのパスワードと、 sys.executable の subprocess 実行を使います。
"tests/**" = ["S101", "S105", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider --strict-markers"
markers = ["mysql: 使い捨ての MySQL が必要なテスト"]
